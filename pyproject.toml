[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlang"
version = "0.1.0"
description = "Prompt Compiler System — DSL → IR → optimized prompts with evaluation and cost analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PromptLang Contributors" }]
keywords = ["llm", "prompt", "compiler", "evaluation", "ai", "gpt", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "tiktoken>=0.6",
]

[project.scripts]
promptlang = "promptlang.cli.main:main"

[project.urls]
Homepage = "https://github.com/promptlang/promptlang"
Repository = "https://github.com/promptlang/promptlang"
Issues = "https://github.com/promptlang/promptlang/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["promptlang"]
omit = ["tests/*"]
